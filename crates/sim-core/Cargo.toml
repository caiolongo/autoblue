[package]
name = "sim-core"
version = "0.1.0"
edition = "2024"
description = "Simulador DC do AutoBlue: análise nodal + Newton-Raphson"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
